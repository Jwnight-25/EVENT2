services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: event2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: event2
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event2"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
