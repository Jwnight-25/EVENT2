name: checks
on: [push, pull_request]
jobs:
  modification-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check-change-log.py
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_USER: event2
          POSTGRES_DB: event2_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U event2" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r backend/requirements-lock.txt
      - run: ruff check backend
      - run: python -m backend.app.manage migrate
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://event2:ci-test-only@127.0.0.1:5432/event2_test' || '' }}
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://event2:ci-test-only@127.0.0.1:5432/event2_test' || '' }}
      - run: alembic check
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://event2:ci-test-only@127.0.0.1:5432/event2_test' || '' }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@11
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
